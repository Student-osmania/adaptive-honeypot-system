<!DOCTYPE html>
<html>
  <head>
    <title>Login - Honeypot</title>
  </head>
  <body>
    <h1>Login to your account</h1>
    <form action="/admin" method="get">
      <input
        type="text"
        name="username"
        placeholder="Username"
        required
      /><br /><br />
      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      /><br /><br />
      <button type="submit">Login</button>
    </form>
  </body>
</html>
